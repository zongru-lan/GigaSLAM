inherit_from: configs/base_config.yaml
Results:
  use_gui: false
  eval_rendering: false
  auto_eval_ate: true
  auto_postprocess_trajectory: false
  auto_eval_monocular: false
  auto_eval_est_convention: w2c
  auto_eval_use_pose_idx: true
  auto_eval_compare_pose_idx: true
Training:
  mapping_itr_num: 3
  init_itr_num: 1050
  tracking_itr_num: 300
Dataset:
  color_path: /root/GigaSLAM/railway_data/scene_11_train
  pose_path: /root/GigaSLAM/railway_data/gt_poses/npy/scene_11_train.npy
  Calibration:
    fx: 7267.95450880415
    fy: 7267.95450880415
    cx: 2056.049238502414
    cy: 1232.862908875167
    k1: -0.0790171
    k2: -0.17716
    p1: 0.0
    p2: 0.0
    k3: 1.7629
    width: 4112
    height: 2504
    distorted: false
SLAM:
  viz: true
  loop_closure: false
  motion_thresh: 0.0
  loop_detect_thresh: 0.034
  2d2d_thread: 20
  n_max: 5000
  disk_max_size: 2048
  num_features_disk: 8192
  scale_smooth_alpha: 0.7
  pnp_first: true
  depth_crop_top: 0.2
  scale_crop_bottom: 0.6
  depth_xval_thresh: 0.3
  3d2d_thread: 40
  log_vo_diag: true
DepthModel:
  backend: unidepth
  railway_ckpt_dir: /root/GigaSLAM/railway_depth_net/ckpt
  railway_model_name: /root/GigaSLAM/railway_depth_net/Depth-Anything-V2-Small-hf
  from_huggingface: false
  huggingface:
    model_name: lpiccinelli/unidepth-v2-vitl14
    commit_hash: 1d0d3c52f60b5164629d279bb9a7546458e6dcc4
  local_snapshot_path: /root/GigaSLAM/unidepth_model
RailScale:
  enabled: true
  apply_correction: true
  correction_mode: metric_width
  metric_width_m: 1.6
  mode: detector
  metric_width_candidates_m:
  - 1.435
  - 1.5
  - 1.55
  - 1.6
  detector_checkpoint: /autodl-fs/data/GigaSLAM/railbench/rail_detector_runs/segformer_b0/best.pt
  detector_device: cuda
  detector_image_size:
  - 768
  - 432
  detector_threshold: 0.3
  detector_min_peak: 0.25
  detector_min_width_px: 12.0
  detector_center_x_frac: 0.5
  detector_peak_topk: 8
  detector_peak_nms_px: 24
  detector_max_width_px_frac: 0.2
  detector_max_center_jump_ratio: 0.18
  calibration_frames: 30
  min_confidence: 0.65
  ema_alpha: 0.2
  min_scale: 0.5
  max_scale: 2.2
  max_scale_step: 0.2
  max_width_jump_ratio: 0.12
  min_samples: 3
  max_detect_width: 1280
  roi_y_min: 0.45
  roi_y_max: 0.95
  sample_y_fracs:
  - 0.58
  - 0.65
  - 0.72
  - 0.8
  - 0.88
  log_diag: true
  log_row_diag: true
  save_debug: true
  debug_every: 20
  detector_row_consistency: true
  detector_row_target_tracking: true
  detector_max_row_center_shift_px: 350.0
  detector_max_row_center_shift_ratio: 0.0
  detector_center_anchor_frames: 0
  detector_max_anchor_center_shift_px: 0.0
  detector_max_anchor_center_shift_ratio: 0.0
  hold_last_scale_on_reject: true
  hold_last_scale_statuses:
  - width_jump
  - center_jump
  - row_inconsistent
  - too_few_samples
Hierarchical:
  voxel_size_lis:
  - 0.1
  - 0.3
  - 1.0
  - 4.0
  - 15.0
  distance_lis:
  - 10.0
  - 30.0
  - 70.0
  - 150.0
  n_offsets: 32
  point_ratio: 16
  appearance_dim: 64
  color_refinement_iter: 0
  rendering_width: 1280
  upsampling_method: bicubic
