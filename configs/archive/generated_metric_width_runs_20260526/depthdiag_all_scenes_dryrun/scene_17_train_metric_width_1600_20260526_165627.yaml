inherit_from: configs/railway/rowtrack350/template.yaml
Results:
  eval_rendering: true
  rendered_depth_diag:
    enabled: true
    keyframes_only: true
    save_npz: true
    save_npz_limit: 20
    save_preview: true
    save_preview_limit: 20
    opacity_threshold: 0.95
    preview_max_depth: 80.0
  auto_eval_ate: true
  auto_eval_use_pose_idx: true
  auto_eval_compare_pose_idx: true
  auto_eval_est_convention: c2w
  auto_eval_monocular: false
  auto_postprocess_trajectory: false
Hierarchical:
  color_refinement_iter: 0
Dataset:
  color_path: /autodl-fs/data/GigaSLAM/railway_data/scene_17_train
  pose_path: /autodl-fs/data/GigaSLAM/railway_data/gt_poses/npy/scene_17_train.npy
SLAM:
  motion_thresh: 0.0
  log_vo_diag: true
RailScale:
  enabled: true
  apply_correction: true
  correction_mode: metric_width
  metric_width_m: 1.6
  metric_width_candidates_m:
  - 1.6
